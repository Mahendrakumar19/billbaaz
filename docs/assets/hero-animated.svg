<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-label="BillBaaz - Commercial Restaurant POS & Operating System by Nighwan Technology">
<style>
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important}}
@keyframes typ{0%,3.00%{width:0}17.00%,93%{width:680px}100%{width:0}}
@keyframes c0{0%,18.00%{opacity:0;transform:translateY(6px)}20.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes c1{0%,21.00%{opacity:0;transform:translateY(6px)}23.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes c2{0%,24.00%{opacity:0;transform:translateY(6px)}26.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes c3{0%,27.00%{opacity:0;transform:translateY(6px)}29.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes lic{0%,38.00%{opacity:0;transform:translateY(6px)}40.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes r0{0%,12.00%{opacity:0;transform:translateY(6px)}14.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes r1{0%,19.00%{opacity:0;transform:translateY(6px)}21.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes r2{0%,26.00%{opacity:0;transform:translateY(6px)}28.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes r3{0%,33.00%{opacity:0;transform:translateY(6px)}35.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes tot{0%,45.00%{opacity:0;transform:translateY(6px)}47.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
@keyframes bdg{0%,55.00%{opacity:0;transform:translateY(6px)}57.00%,93.00%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
.title,.sub{animation:rise 14.0s ease-out infinite}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}4%,93%{opacity:1;transform:translateY(0)}100%{opacity:0}}
.typ{animation:typ 14.0s steps(58) infinite}
.float{animation:flt 6s ease-in-out infinite}
@keyframes flt{50%{transform:translateY(-8px)}}
.orb{animation:orb 7s ease-in-out infinite}
.o2{animation-delay:-2s}.o3{animation-delay:-4s}
@keyframes orb{50%{transform:translateY(-18px);opacity:.4}}
.c0{animation:c0 14.0s ease-out infinite;opacity:0}
.c1{animation:c1 14.0s ease-out infinite;opacity:0}
.c2{animation:c2 14.0s ease-out infinite;opacity:0}
.c3{animation:c3 14.0s ease-out infinite;opacity:0}
.r0{animation:r0 14.0s ease-out infinite;opacity:0}
.r1{animation:r1 14.0s ease-out infinite;opacity:0}
.r2{animation:r2 14.0s ease-out infinite;opacity:0}
.r3{animation:r3 14.0s ease-out infinite;opacity:0}
.lic{animation:lic 14.0s ease-out infinite;opacity:0}
.tot{animation:tot 14.0s ease-out infinite;opacity:0}
.bdg{animation:bdg 14.0s ease-out infinite;opacity:0}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070c18"/><stop offset="1" stop-color="#111827"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B00"/><stop offset="1" stop-color="#FF9E00"/></linearGradient>
<radialGradient id="g1" cx="0.2" cy="0.1" r="0.7"><stop offset="0" stop-color="#FF6B00" stop-opacity="0.32"/><stop offset="1" stop-color="#FF6B00" stop-opacity="0"/></radialGradient>
<radialGradient id="g2" cx="0.9" cy="0.9" r="0.7"><stop offset="0" stop-color="#E23744" stop-opacity="0.25"/><stop offset="1" stop-color="#E23744" stop-opacity="0"/></radialGradient>
<clipPath id="tclip"><rect class="typ" x="60" y="188" width="0" height="40"/></clipPath>
</defs>
<rect width="1200" height="450" rx="20" fill="url(#bg)"/><rect width="1200" height="450" rx="20" fill="url(#g1)"/><rect width="1200" height="450" rx="20" fill="url(#g2)"/>
<circle class="orb o1" cx="520" cy="70" r="5" fill="#FF6B00"/><circle class="orb o2" cx="610" cy="380" r="4" fill="#E23744"/><circle class="orb o3" cx="90" cy="400" r="3" fill="#FF9E00"/>

<!-- Brand Title & Tagline -->
<text x="60" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="900" fill="url(#ac)" class="title">BillBaaz</text>
<text x="320" y="118" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="28" font-weight="700" fill="#f8fafc" class="title">· Billing ka baazigar</text>
<text x="60" y="160" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" fill="#cbd5e1" class="sub">All-in-One Restaurant Operating System &amp; Cloud POS</text>

<!-- Typing Feature Subtitle -->
<g clip-path="url(#tclip)"><text x="60" y="214" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#FF9E00">Zomato/Swiggy Hub, WhatsApp Bills, UPI QR, KDS &amp; Costing</text></g>

<!-- Badges -->
<g class="c0"><rect x="60" y="262" width="160" height="34" rx="17" fill="none" stroke="#FF6B00" stroke-opacity="0.6"/><text x="140" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🛵 Zomato &amp; Swiggy</text></g>
<g class="c1"><rect x="232" y="262" width="160" height="34" rx="17" fill="none" stroke="#25D366" stroke-opacity="0.6"/><text x="312" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">💬 WhatsApp Bills</text></g>
<g class="c2"><rect x="404" y="262" width="140" height="34" rx="17" fill="none" stroke="#FF9E00" stroke-opacity="0.6"/><text x="474" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">⚡ 0% MDR UPI QR</text></g>
<g class="c3"><rect x="556" y="262" width="130" height="34" rx="17" fill="none" stroke="#38bdf8" stroke-opacity="0.6"/><text x="621" y="284" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f8fafc">🍳 Kitchen KDS</text></g>

<!-- Pride in India & Company Attribution -->
<g class="lic">
  <text x="60" y="352" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">Made with pride in India by Nighwan Technology Pvt. Ltd. (nighwantech.com)</text>
  <rect x="60" y="372" width="220" height="3" rx="2" fill="url(#ac)"/>
</g>

<!-- Animated Right POS Screen Mockup -->
<g class="float">
  <rect x="710" y="45" width="440" height="360" rx="16" fill="#0f172a" stroke="#334155"/>
  <rect x="710" y="45" width="440" height="42" rx="16" fill="#1e293b"/>
  <rect x="710" y="73" width="440" height="14" fill="#1e293b"/>
  <circle cx="732" cy="66" r="6" fill="#ef4444"/>
  <circle cx="752" cy="66" r="6" fill="#f59e0b"/>
  <circle cx="772" cy="66" r="6" fill="#22c55e"/>
  <text x="796" y="71" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#f8fafc">BillBaaz POS · Table 7 (Dine-in)</text>

  <!-- Animated Order Items -->
  <g class="r0">
    <text x="738" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e2e8f0">Paneer Tikka x2</text>
    <text x="1122" y="126" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e2e8f0">₹520.00</text>
    <line x1="738" y1="138" x2="1122" y2="138" stroke="#1e293b"/>
  </g>
  <g class="r1">
    <text x="738" y="166" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e2e8f0">Butter Naan x4</text>
    <text x="1122" y="166" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e2e8f0">₹240.00</text>
    <line x1="738" y1="178" x2="1122" y2="178" stroke="#1e293b"/>
  </g>
  <g class="r2">
    <text x="738" y="206" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#e2e8f0">Dal Makhani Special</text>
    <text x="1122" y="206" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#e2e8f0">₹280.00</text>
    <line x1="738" y1="218" x2="1122" y2="218" stroke="#1e293b"/>
  </g>
  <g class="r3">
    <text x="738" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#94a3b8">GST (5%)</text>
    <text x="1122" y="246" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#94a3b8">₹52.00</text>
    <line x1="738" y1="258" x2="1122" y2="258" stroke="#1e293b"/>
  </g>

  <!-- Total Banner -->
  <g class="tot">
    <rect x="730" y="278" width="400" height="48" rx="12" fill="url(#ac)" opacity="0.95"/>
    <text x="748" y="309" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="900" fill="#070c18">TOTAL AMOUNT</text>
    <text x="1112" y="310" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="900" fill="#070c18">₹1,092.00</text>
  </g>

  <!-- Kitchen & WhatsApp Ready Badge -->
  <g class="bdg">
    <rect x="730" y="346" width="310" height="36" rx="18" fill="#052e1a" stroke="#22c55e"/>
    <circle cx="752" cy="364" r="7" fill="#22c55e"/>
    <path d="M748.5 364 l2.5 2.8 l5 -5.6" stroke="#052e1a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="768" y="369" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#86efac">KOT sent &amp; WhatsApp Bill Ready</text>
  </g>
</g>
</svg>